<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Verificador de Entradas</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Arial Black', Arial, sans-serif;
      background: #000;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Zona cámara ── */
    #camera-container {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    #camera-stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Marco guía de escaneo */
    #scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
      width: 58%;
      aspect-ratio: 1;
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 10px;
      pointer-events: none;
    }

    /* Esquinas del marco */
    #scan-frame::before,
    #scan-frame::after,
    #scan-frame span::before,
    #scan-frame span::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: #fff;
      border-style: solid;
    }
    #scan-frame::before  { top: -2px;    left: -2px;  border-width: 4px 0 0 4px; border-radius: 4px 0 0 0; }
    #scan-frame::after   { top: -2px;    right: -2px; border-width: 4px 4px 0 0; border-radius: 0 4px 0 0; }
    #scan-frame span::before { bottom: -2px; left: -2px;  border-width: 0 0 4px 4px; border-radius: 0 0 0 4px; }
    #scan-frame span::after  { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-radius: 0 0 4px 0; }

    /* Overlay de resultado (flash de color) */
    #overlay {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }

    /* Barra de estado superior */
    #status-bar {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 14px 16px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 3px;
      z-index: 10;
      transition: opacity 0.2s;
    }

    /* ── Panel de resultado inferior ── */
    #result-panel {
      background: #0d0d0d;
      padding: 18px 20px 22px;
      text-align: center;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-top: 1px solid #222;
    }

    #result-mensaje {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 1px;
      transition: color 0.15s;
    }

    #result-codigo {
      font-size: 10px;
      color: #444;
      font-family: monospace;
      letter-spacing: 0.5px;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Estado verificando */
    body.verificando #status-bar { opacity: 0.4; }
    body.verificando #scan-frame { border-color: rgba(255,255,255,0.15); }
  </style>
</head>
<body>

<div id="camera-container">
  <video id="camera-stream" autoplay playsinline muted></video>
  <div id="scan-frame"><span></span></div>
  <div id="overlay"></div>
  <div id="status-bar">&#9654; ESCANEA LA ENTRADA</div>
</div>

<div id="result-panel">
  <div id="result-mensaje" style="color:#555;">—</div>
  <div id="result-codigo"></div>
</div>

<script>
  // ─────────────────────────────────────────────────────────────
  //  ⚠️  REEMPLAZA ESTA URL CON LA DE TU WEBAPP DE GOOGLE APPS SCRIPT
  // ─────────────────────────────────────────────────────────────
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzSsEsoMHjp1qcad_HytBJyrShrORLWCBG7ArvAeqU/dev';
  // ─────────────────────────────────────────────────────────────

  const video       = document.getElementById('camera-stream');
  const overlay     = document.getElementById('overlay');
  const statusBar   = document.getElementById('status-bar');
  const msgEl       = document.getElementById('result-mensaje');
  const codigoEl    = document.getElementById('result-codigo');

  // Canvas persistente — se crea una sola vez
  const canvas = document.createElement('canvas');
  const ctx    = canvas.getContext('2d', { willReadFrequently: true });

  let verificando   = false;
  let cooldownHasta = 0;
  let ultimoFrame   = 0;

  // ── Arrancar cámara ──────────────────────────────────────────
  async function arrancarCamara() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      await video.play();

      canvas.width  = video.videoWidth  || 1280;
      canvas.height = video.videoHeight || 720;

      // Warm-up: activa el entorno GAS antes del primer escaneo real
      fetch(GAS_URL + '?codigo=__ping__').catch(() => {});

      requestAnimationFrame(bucleEscaneo);
    } catch (err) {
      statusBar.textContent = '✗ SIN ACCESO A LA CAMARA';
    }
  }

  // ── Bucle de escaneo continuo (rAF + throttle 250ms) ─────────
  function bucleEscaneo(timestamp) {
    requestAnimationFrame(bucleEscaneo);

    // Throttle: máximo una lectura cada 250ms
    if (timestamp - ultimoFrame < 250) return;
    ultimoFrame = timestamp;

    if (verificando || Date.now() < cooldownHasta) return;
    if (video.readyState < video.HAVE_ENOUGH_DATA) return;

    // Ajustar canvas si cambió la resolución
    if (canvas.width !== video.videoWidth && video.videoWidth) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

    // inversionAttempts: 'dontInvert' — omite QR invertidos (más rápido)
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert'
    });

    if (code?.data) {
      verificar(code.data);
    }
  }

  // ── Verificar código contra GAS ──────────────────────────────
  async function verificar(codigo) {
    verificando = true;
    statusBar.textContent = '⏳ VERIFICANDO...';
    document.body.classList.add('verificando');
    codigoEl.textContent = codigo;

    try {
      const res = await fetch(GAS_URL + '?codigo=' + encodeURIComponent(codigo));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const result = await res.json();
      mostrarResultado(result);
    } catch (err) {
      mostrarResultado({ mensaje: 'ERROR DE RED', color: '#ff6600' });
    } finally {
      verificando   = false;
      cooldownHasta = Date.now() + 1500; // 1.5s de pausa tras mostrar resultado
    }
  }

  // ── Mostrar resultado + flash de color ───────────────────────
  function mostrarResultado(result) {
    document.body.classList.remove('verificando');

    msgEl.textContent  = result.mensaje;
    msgEl.style.color  = result.color;
    statusBar.textContent = '▶ ESCANEA LA ENTRADA';

    // Flash: aparece en 0ms, desaparece a los 500ms
    overlay.style.backgroundColor = result.color;
    overlay.style.opacity = '0.45';
    setTimeout(() => { overlay.style.opacity = '0'; }, 500);
  }

  arrancarCamara();
</script>
</body>
</html>
