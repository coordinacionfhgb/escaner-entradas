<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Verificador de Entradas</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Arial', Helvetica, sans-serif;
      background: #0a0a0a;
      color: #fff;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Zona cámara ── */
    #camera-container {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: #000;
    }

    #camera-stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── Flash de resultado ── */
    #overlay {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }

    /* ── Marco de escaneo ── */
    #scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
      width: 62%;
      aspect-ratio: 1;
      overflow: hidden;
    }

    /* Esquinas del marco */
    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: rgba(255, 255, 255, 0.9);
      border-style: solid;
      transition: border-color 0.3s;
    }
    .corner.tl { top: 0;    left: 0;   border-width: 3px 0 0 3px; }
    .corner.tr { top: 0;    right: 0;  border-width: 3px 3px 0 0; }
    .corner.bl { bottom: 0; left: 0;   border-width: 0 0 3px 3px; }
    .corner.br { bottom: 0; right: 0;  border-width: 0 3px 3px 0; }

    body.verificando .corner {
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* ── Línea de escaneo verde ── */
    #scan-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(
        to right,
        transparent 0%,
        rgba(0, 230, 118, 0.4) 10%,
        #00e676 40%,
        #00e676 60%,
        rgba(0, 230, 118, 0.4) 90%,
        transparent 100%
      );
      box-shadow: 0 0 8px 2px rgba(0, 230, 118, 0.5);
      animation: scanAnim 2.2s ease-in-out infinite;
      transition: opacity 0.2s;
    }

    @keyframes scanAnim {
      0%   { top: 3%;  }
      50%  { top: 94%; }
      100% { top: 3%;  }
    }

    body.verificando #scan-line {
      opacity: 0;
      animation-play-state: paused;
    }

    /* ── Spinner de verificación ── */
    #spinner-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 44px;
      height: 44px;
      margin: -22px 0 0 -22px;
      display: none;
    }

    #spinner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #fff;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    body.verificando #spinner-wrap { display: block; }

    /* ── Barra de estado ── */
    #status-bar {
      position: absolute;
      top: 0;
      width: 100%;
      padding: 16px 16px 32px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 5px;
      color: rgba(255, 255, 255, 0.75);
      z-index: 10;
      transition: color 0.2s;
    }

    body.verificando #status-bar {
      color: rgba(255, 255, 255, 0.35);
    }

    /* ── Panel de resultado ── */
    #result-panel {
      background: #101010;
      padding: 20px 24px 26px;
      text-align: center;
      min-height: 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-top: 1px solid #1c1c1c;
    }

    #result-mensaje {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #2a2a2a;
      transition: color 0.15s;
      line-height: 1;
    }

    #result-codigo {
      font-size: 9px;
      color: #2e2e2e;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.15s;
    }

    body.con-resultado #result-codigo {
      color: #444;
    }
  </style>
</head>
<body>

<div id="camera-container">
  <video id="camera-stream" autoplay playsinline muted></video>

  <div id="scan-frame">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div id="scan-line"></div>
    <div id="spinner-wrap"><div id="spinner"></div></div>
  </div>

  <div id="overlay"></div>
  <div id="status-bar">ESCANEANDO</div>
</div>

<div id="result-panel">
  <div id="result-mensaje">—</div>
  <div id="result-codigo"></div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyb6u5hXXjmTalmvSB4IkZZe6gY-OlIsD6um78Vg_8kbiUiu_HnkpfYjnOwo97LqaQs/exec';

  const video     = document.getElementById('camera-stream');
  const overlay   = document.getElementById('overlay');
  const statusBar = document.getElementById('status-bar');
  const msgEl     = document.getElementById('result-mensaje');
  const codigoEl  = document.getElementById('result-codigo');

  const canvas = document.createElement('canvas');
  const ctx    = canvas.getContext('2d', { willReadFrequently: true });

  let verificando   = false;
  let cooldownHasta = 0;
  let ultimoFrame   = 0;

  async function arrancarCamara() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      await video.play();
      canvas.width  = video.videoWidth  || 1280;
      canvas.height = video.videoHeight || 720;
      fetch(GAS_URL + '?codigo=__ping__').catch(() => {});
      requestAnimationFrame(bucleEscaneo);
    } catch (err) {
      statusBar.textContent = 'SIN ACCESO A LA CAMARA';
    }
  }

  function bucleEscaneo(timestamp) {
    requestAnimationFrame(bucleEscaneo);
    if (timestamp - ultimoFrame < 250) return;
    ultimoFrame = timestamp;
    if (verificando || Date.now() < cooldownHasta) return;
    if (video.readyState < video.HAVE_ENOUGH_DATA) return;
    if (canvas.width !== video.videoWidth && video.videoWidth) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
    }
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, {
      inversionAttempts: 'dontInvert'
    });
    if (code?.data) verificar(code.data);
  }

  async function verificar(codigo) {
    verificando = true;
    statusBar.textContent = 'VERIFICANDO';
    document.body.classList.add('verificando');
    document.body.classList.remove('con-resultado');
    codigoEl.textContent = codigo;

    try {
      const res = await fetch(GAS_URL + '?codigo=' + encodeURIComponent(codigo));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const result = await res.json();
      mostrarResultado(result);
    } catch (err) {
      mostrarResultado({ mensaje: 'ERROR DE RED', color: '#ff6600' });
    } finally {
      verificando   = false;
      cooldownHasta = Date.now() + 1500;
    }
  }

  function mostrarResultado(result) {
    document.body.classList.remove('verificando');
    document.body.classList.add('con-resultado');
    msgEl.textContent = result.mensaje;
    msgEl.style.color = result.color;
    statusBar.textContent = 'ESCANEANDO';
    overlay.style.backgroundColor = result.color;
    overlay.style.opacity = '0.35';
    setTimeout(() => { overlay.style.opacity = '0'; }, 500);
  }

  arrancarCamara();
</script>
</body>
</html>
